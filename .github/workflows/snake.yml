name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SrAlegre
          outputs: |
            dist/github-snake.svg?color_snake=%236366F1&color_dots=%23EBEDF0,%23DDD6FE,%23C4B5FD,%238B5CF6,%235B21B6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%23161B22,%23312E81,%234F46E5,%237C3AED,%23C4B5FD

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
